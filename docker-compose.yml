services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dcf
      POSTGRES_USER: dcf
      POSTGRES_PASSWORD: dcf_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  api:
    build:
      context: .
      dockerfile: DCF.Api/Dockerfile
    image: dcf-api
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - mosquitto
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=dcf;Username=dcf;Password=dcf_dev_password
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__Audience=${AUTH0_AUDIENCE}
      - Mqtt__Host=mosquitto

volumes:
  postgres_data:
