services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dcf
      POSTGRES_USER: dcf
      POSTGRES_PASSWORD: dcf_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  api:
    build:
      context: .
      dockerfile: DCF.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=dcf;Username=dcf;Password=dcf_dev"
      Mqtt__Host: mosquitto
      Mqtt__Port: "1883"
      Auth0__Domain: "${AUTH0_DOMAIN}"
      Auth0__Audience: "${AUTH0_AUDIENCE}"
      Scraper__DelayMinutes: "5"
    depends_on:
      - postgres
      - mosquitto

volumes:
  postgres_data:
